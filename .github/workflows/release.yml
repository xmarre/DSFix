name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          root = ET.fromstring(pathlib.Path('Directory.Build.props').read_text())
          print(root.findtext('.//Version'))
          PY
          )"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Restore and build
        run: |
          dotnet restore DSFix.sln
          dotnet build DSFix.sln -c Release --no-restore

      - name: Build release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/stage/DSFix"
          mkdir -p "${stage}/bin/Win64_Shipping_Client"
          cp DSFix/SubModule.xml "${stage}/SubModule.xml"
          cp DSFix/bin/Release/net472/DSFix.dll "${stage}/bin/Win64_Shipping_Client/DSFix.dll"
          cp DSFix.InBattleNaming/bin/Release/net472/DSFix.InBattleNaming.dll "${stage}/bin/Win64_Shipping_Client/DSFix.InBattleNaming.dll"
          cp README.md "${stage}/README.txt"
          cp CHANGELOG.md "${stage}/CHANGELOG.txt"
          cp VALIDATION.md "${stage}/VALIDATION.txt"
          archive="DSFix-v${VERSION}-Bannerlord-1.3.15-TOR-WiTM-1.16.zip"
          (cd dist/stage && zip -r -9 "../${archive}" DSFix >/dev/null)
          (cd dist && sha256sum "${archive}" > SHA256SUMS)
          python tools/validate_release.py --zip "dist/${archive}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "${TAG}" \
            "dist/DSFix-v${VERSION}-Bannerlord-1.3.15-TOR-WiTM-1.16.zip" \
            dist/SHA256SUMS \
            --target "${RELEASE_SHA}" \
            --title "DSFix ${TAG}" \
            --notes-file RELEASE_NOTES.md
