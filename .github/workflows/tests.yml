name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DSFix.sln

      - name: Build Bannerlord 1.3.15 release binaries
        run: dotnet build DSFix.sln -c Release --no-restore

      - name: Collect build outputs for validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/DSFix artifacts/DSFix.InBattleNaming
          cp DSFix/bin/Release/net472/DSFix.dll artifacts/DSFix/DSFix.dll
          cp DSFix.InBattleNaming/bin/Release/net472/DSFix.InBattleNaming.dll artifacts/DSFix.InBattleNaming/DSFix.InBattleNaming.dll

      - name: Validate source and build outputs
        run: python tools/validate_release.py --build-root "${{ github.workspace }}/artifacts"
